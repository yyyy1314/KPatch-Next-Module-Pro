name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft prerelease from this main commit
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yyyy1314/KPatch-Next-Pro
          ref: 3076922686d7a322b539d515cea35d042bda01a0
          path: engine
          fetch-depth: 0
      - name: Install compiler
        run: |
          curl -fL -o toolchain.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf toolchain.tar.xz
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
      - name: Build both engines
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: TARGET_COMPILE="$GITHUB_WORKSPACE/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-" bash engine/build-engines.sh "$GITHUB_WORKSPACE/module/bin/engines"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - name: Build module
        run: bash build.sh
      - name: Read module version
        id: version
        run: |
          VERSION=$(sed -n 's/^version=//p' module/module.prop)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: KPatch-Next-Module-Pro-${{ steps.version.outputs.name }}
          path: module/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.create_draft
        with:
          name: release-package-${{ github.sha }}
          path: out/KPatch-Next-Module-Pro-${{ steps.version.outputs.name }}.zip
          if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.name }}

  draft-release:
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-package-${{ github.sha }}
          path: release-files
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          ENGINE_COMMIT: 3076922686d7a322b539d515cea35d042bda01a0
        run: |
          cp CHANGELOG.md release-notes.md
          printf '\nModule source: https://github.com/%s/tree/%s\nEngine manifest: https://github.com/yyyy1314/KPatch-Next-Pro/blob/%s/engines.json\n\nSHA-256: ' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$ENGINE_COMMIT" >> release-notes.md
          sha256sum "release-files/KPatch-Next-Module-Pro-$VERSION.zip" >> release-notes.md
          gh release create "$VERSION" "release-files/KPatch-Next-Module-Pro-$VERSION.zip" --target "$GITHUB_SHA" --title "$VERSION" --notes-file release-notes.md --draft --prerelease
