name: Build

on:
  push:
    branches: [use-kernelpatch-0.13.9]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yyyy1314/KPatch-Next
          ref: 9fde879c66287dcc2d7847519b3316462272a6c0
          path: engine
      - name: Install compiler
        run: |
          curl -fL -o toolchain.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf toolchain.tar.xz
      - name: Build kpimg
        run: make -C engine/kernel TARGET_COMPILE="$GITHUB_WORKSPACE/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-" -j2
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
      - name: Build Android tools
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          for component in tools user; do
            cmake -S "engine/$component" -B "engine/$component/build/android" -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" -DCMAKE_BUILD_TYPE=Release -DANDROID_PLATFORM=android-33 -DANDROID_ABI=arm64-v8a
            cmake --build "engine/$component/build/android" -j2
          done
          mkdir -p module/bin
          cp engine/kernel/kpimg module/bin/kpimg
          cp engine/tools/build/android/kptools module/bin/kptools
          cp engine/user/build/android/kpatch module/bin/kpatch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - name: Build module
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KPatch-Next-Module-kp0.13.9-1-${{ github.sha }}
          path: out/*.zip
          if-no-files-found: error
